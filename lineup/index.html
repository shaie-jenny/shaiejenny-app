<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Line-up</title>
<style>
  :root {
    --text: #fff;
    --soft: rgba(255,255,255,0.7);
    --faint: rgba(255,255,255,0.48);
    --card: rgba(255,255,255,0.07);
    --bubble: rgba(255,255,255,0.08);
    --tint: #FFB89E;
    --tick: #7BD88F;
    --bg: #1a1020;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { background: transparent; }
  html, body { margin: 0; color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center; }
  a { color: inherit; text-decoration: none; }
  .backdrop { position: fixed; inset: 0; z-index: -2; background: var(--wash, var(--bg)); background-size: cover; background-position: center;
    filter: blur(50px) brightness(0.7); transform: scale(1.2); }
  .hero { height: 290px; background: var(--wash, var(--bg)); background-size: cover; background-position: center;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 56px; }
  .titles { margin-top: -110px; position: relative; padding: 0 12px; }
  h1 { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; font-weight: 600;
    font-size: clamp(30px, 8.5vw, 40px); line-height: 1.1; margin: 0 0 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.25); }
  .meta { font-size: 15px; color: var(--soft); line-height: 1.45; }
  .primary { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; margin: 22px 0 0;
    border-radius: 999px; background: rgba(255,255,255,0.92); color: #111; font-size: 15px; font-weight: 600; }
  .primary svg { width: 17px; height: 17px; }
  .card { background: var(--card); border-radius: 28px; padding: 20px; margin-top: 14px; overflow: hidden;
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  .label { font-size: 15px; font-weight: 600; color: var(--faint); margin: 0 0 8px; }
  .sub { font-size: 13px; color: var(--faint); }
  .body { font-size: 15px; }
  .weather .icon { font-size: 30px; margin: 4px 0 6px; }
  .map { margin: -20px -20px 16px; height: 160px; }
  .map iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .place { font-size: 15px; font-weight: 600; }
  .group { margin-top: 10px; }
  .group:first-of-type { margin-top: 0; }
  .tick { color: var(--tick); font-size: 12px; margin-left: 4px; }
  .song { margin-top: 8px; }
  .song:first-of-type { margin-top: 0; }
  .seg { display: flex; margin-top: 14px; border-radius: 22px; overflow: hidden; background: var(--bubble); }
  .seg a { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 44px; padding: 0 6px; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background 0.15s; }
  .seg a + a { border-left: 1px solid rgba(255,255,255,0.1); }
  .seg a:active, .bubble:active, .primary:active { opacity: 0.75; }
  .bubbles { display: flex; gap: 12px; margin-top: 4px; }
  .bubble { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    min-height: 84px; border-radius: 28px; background: var(--bubble); font-size: 13px; font-weight: 600; }
  .appicon { width: 22px; height: 22px; flex: none; border-radius: 5.5px;
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.18), 0 1px 3px rgba(0,0,0,0.3); }
  .bubble .appicon { width: 26px; height: 26px; border-radius: 6.5px; }
  .status { padding: 30vh 24px; color: var(--soft); }
  footer { margin-top: 28px; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div id="app"><p class="status">Loading the line-up…</p></div>

<script>
// Repertoire line-up page. The link's #fragment is the line-up's ID; the
// details live in Repertoire's public iCloud database (read-only here).
const CONTAINER = "iCloud.com.shaiejenny.repertoire";
// Read-only keys for the public database, one per iCloud environment.
// TestFlight and App Store builds use production; test builds use development.
const API_TOKENS = {
  production: "67422dea7adc6bf7f3d02701b1cd6d21a79e9bfc3c96d371d830c0af70e35265",
  development: "d5fbe48a8d0669745d7c1d94a5f0de751d1df3c9589d71daa28c780d435a1357"
};

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeURL = u => /^https:\/\//i.test(u || "") ? u : null;

function showStatus(text) { app.innerHTML = `<p class="status">${esc(text)}</p>`; }

async function lookup(id) {
  for (const [env, token] of Object.entries(API_TOKENS)) {
    if (!/^[0-9a-f]{64}$/.test(token)) continue;
    try {
      const res = await fetch(`https://api.apple-cloudkit.com/database/1/${CONTAINER}/${env}/public/records/lookup?ckAPIToken=${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ records: [{ recordName: "lineup-" + id }] })
      });
      if (!res.ok) continue;
      const record = (await res.json()).records?.[0];
      if (record && record.fields?.payload) return record;
    } catch (e) { /* try the next environment */ }
  }
  return null;
}

// The 3×3 colour wash from the app, as layered gradients.
function wash(colors) {
  if (!colors || colors.length < 9) return "";
  const at = [[0,0],[50,0],[100,0],[0,50],[45,55],[100,50],[0,100],[50,100],[100,100]];
  const layers = colors.map((c, i) => `radial-gradient(circle at ${at[i][0]}% ${at[i][1]}%, ${c} 0%, transparent 62%)`);
  return layers.join(", ") + `, ${colors[4]}`;
}

const WEATHER_ICONS = [
  ["thunder", "⛈️"], ["snow", "❄️"], ["sleet", "🌨️"], ["hail", "🌨️"], ["heavyrain", "🌧️"], ["rain", "🌧️"], ["drizzle", "🌦️"],
  ["fog", "🌫️"], ["haze", "🌫️"], ["wind", "💨"], ["moon", "🌙"], ["sun.max", "☀️"], ["cloud.sun", "⛅️"], ["cloud", "☁️"], ["sun", "🌤️"]
];
const weatherIcon = symbol => (WEATHER_ICONS.find(([key]) => (symbol || "").replace(/\./g, ".").includes(key)) || [, "🌡️"])[1];

function formatWhen(iso, tz, long = true) {
  const d = new Date(iso);
  const opts = long ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "numeric", month: "short" };
  const day = d.toLocaleDateString("en-GB", { ...opts, timeZone: tz }).replace(",", "");
  const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: tz });
  return `${day}, ${time}`;
}
const dayOnly = (iso, tz) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long", timeZone: tz });

// App icons (from the App Store), shown only to link to each app.
const appIcon = name => `<img class="appicon" src="icons/${name}.jpg" alt="" width="22" height="22">`;

function icsLink(p) {
  const start = new Date(p.date);
  const end = new Date(start.getTime() + 2 * 3600 * 1000);
  const stamp = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const text = s => String(s || "").replace(/[,;\\]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Repertoire//Line-up//EN", "BEGIN:VEVENT",
    `UID:${location.hash.slice(1)}@repertoire`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`,
    `SUMMARY:${text(p.name)}`, `LOCATION:${text([p.place, p.address].filter(Boolean).join(", "))}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

function render(p, photoURL) {
  document.title = p.name;
  const bg = photoURL ? `url("${photoURL}")` : wash(p.gradient);
  document.documentElement.style.setProperty("--wash", bg);

  const lat = p.latitude, lon = p.longitude, hasMap = typeof lat === "number" && typeof lon === "number";
  const apple = safeURL(p.mapsURL);
  const google = hasMap ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}` : null;
  const waze = hasMap ? `https://waze.com/ul?ll=${lat},${lon}&navigate=yes` : null;
  const osm = hasMap ? `https://www.openstreetmap.org/export/embed.html?bbox=${lon - 0.006},${lat - 0.004},${lon + 0.006},${lat + 0.004}&layer=mapnik&marker=${lat},${lon}` : null;

  const weather = p.weather ? `
    <section class="card weather">
      <div class="label">Weather</div>
      <div class="sub">${esc(dayOnly(p.date, p.timeZone))}</div>
      <div class="icon">${weatherIcon(p.weather.symbol)}</div>
      <div class="body">${esc(p.weather.condition)}${p.weather.temperature ? ", " + esc(p.weather.temperature) : ""}. High ${esc(p.weather.high)}, low ${esc(p.weather.low)}, with a ${esc(p.weather.rainChance)}% chance of rain.</div>
      <div class="sub" style="margin-top:8px"> Weather${p.weatherAsOf ? " · as of " + esc(formatWhen(p.weatherAsOf, p.timeZone, false)) : ""}</div>
    </section>` : "";

  const where = (p.place || hasMap) ? `
    <section class="card">
      ${osm ? `<div class="map"><iframe src="${osm}" loading="lazy" title="Map"></iframe></div>` : ""}
      <div class="place">${esc(p.place)}</div>
      ${p.address && p.address !== p.place ? `<div class="sub">${esc(p.address)}</div>` : ""}
      ${(apple || google || waze) ? `<nav class="seg" aria-label="Directions">
        ${apple ? `<a href="${esc(apple)}" aria-label="Directions in Apple Maps">${appIcon("apple-maps")}Apple</a>` : ""}
        ${google ? `<a href="${esc(google)}" aria-label="Directions in Google Maps">${appIcon("google-maps")}Google</a>` : ""}
        ${waze ? `<a href="${esc(waze)}" aria-label="Directions in Waze">${appIcon("waze")}Waze</a>` : ""}
      </nav>` : ""}
    </section>` : "";

  const count = (p.roles || []).reduce((n, r) => n + r.names.length, 0);
  const roles = p.roles?.length ? `
    <section class="card">
      <div class="label">${count} Confirmed</div>
      ${p.roles.map(r => `<div class="group"><div class="sub">${esc(r.role)}</div>${r.names.map(n => `<div class="body">${esc(n)}<span class="tick">✓</span></div>`).join("")}</div>`).join("")}
    </section>` : "";

  const songs = p.songs?.length ? `
    <section class="card">
      <div class="label">Set List</div>
      ${p.songs.map(s => `<div class="song"><div class="body">${esc(s.title)}</div>${s.artist ? `<div class="sub">${esc(s.artist)}</div>` : ""}</div>`).join("")}
    </section>` : "";

  const am = safeURL(p.appleMusicURL), sp = safeURL(p.spotifyURL);
  const playlists = (am || sp) ? `
    <section class="card">
      <div class="label">Playlists</div>
      <div class="bubbles">
        ${am ? `<a class="bubble" href="${esc(am)}">${appIcon("apple-music")}Apple Music</a>` : ""}
        ${sp ? `<a class="bubble" href="${esc(sp)}">${appIcon("spotify")}Spotify</a>` : ""}
      </div>
    </section>` : "";

  const rehearsal = p.rehearsal ? `
    <section class="card">
      <div class="label">Rehearsal</div>
      <div class="body">${esc(formatWhen(p.rehearsal.date, p.timeZone))}</div>
      ${p.rehearsal.place ? `<div class="sub">${esc(p.rehearsal.place)}</div>` : ""}
    </section>` : "";

  const calendarIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

  app.innerHTML = `
    <div class="hero"></div>
    <main>
      <div class="titles">
        <h1>${esc(p.name)}</h1>
        <div class="meta">${esc(formatWhen(p.date, p.timeZone, false))}${p.place ? `<br>${esc(p.place)}` : ""}</div>
      </div>
      <a class="primary" href="${icsLink(p)}" download="${esc(p.name)}.ics">${calendarIcon}Add to Calendar</a>
      ${weather}${where}${roles}${songs}${playlists}${rehearsal}
      <footer>Made with Repertoire</footer>
    </main>`;
}

(async () => {
  const id = location.hash.slice(1).toLowerCase();
  if (!/^[0-9a-f-]{36}$/.test(id)) { showStatus("This link isn't complete. Ask whoever sent it for the full link."); return; }
  const record = await lookup(id);
  if (!record) { showStatus("This line-up isn't available any more."); return; }
  let payload;
  try { payload = JSON.parse(record.fields.payload.value); } catch { showStatus("This line-up couldn't be read."); return; }
  const asset = record.fields.background?.value?.downloadURL;
  render(payload, asset ? asset.replace("${f}", "background.jpg") : null);
})();
</script>
</body>
</html>
