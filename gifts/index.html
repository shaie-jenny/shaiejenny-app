<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Wishlist</title>
<style>
  :root {
    --cream: #F8F1E7;
    --ink: #3B2F27;
    --soft: #8C796A;
    --coral: #EE7B6A;
    --accent: #EE7B6A;
    --card: rgba(255,255,255,0.62);
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); }
  html, body { margin: 0; color: var(--ink);
    font: 16px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wash { position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 38%, transparent) 0%, transparent 60%),
      radial-gradient(circle at 0% 50%, rgba(237,185,74,0.30) 0%, transparent 55%),
      radial-gradient(circle at 100% 55%, rgba(118,163,219,0.28) 0%, transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(229,139,178,0.30) 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(127,174,134,0.32) 0%, transparent 55%),
      var(--cream); }
  main { max-width: 560px; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 18px 56px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: ui-serif, "New York", Georgia, serif; font-weight: 600; font-size: clamp(32px, 9vw, 42px);
    line-height: 1.08; margin: 6px 0 6px; }
  .sub { color: var(--soft); font-size: 16px; }
  .list { margin-top: 26px; display: grid; gap: 10px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 24px; background: var(--card);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 6px 22px rgba(59,47,39,0.06); }
  .num { flex: none; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 700; color: #fff; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent)); }
  .thumb { flex: none; width: 58px; height: 58px; border-radius: 16px; object-fit: cover; background: #fff;
    box-shadow: 0 0 0 1px rgba(59,47,39,0.06); }
  .text { flex: 1 1 auto; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; }
  .shop { font-size: 13px; color: var(--soft); margin-top: 1px; }
  .open { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--ink); color: var(--cream);
    font-size: 14px; font-weight: 600; }
  .open:active, .item:active { opacity: 0.8; }
  .note { margin-top: 18px; padding: 16px; border-radius: 24px; background: rgba(237,185,74,0.18); }
  .note .label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); }
  .note .body { font-weight: 600; margin-top: 2px; }
  .hint { margin-top: 22px; text-align: center; font-size: 13px; color: var(--soft); }
  footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--soft); }
  footer b { font-family: ui-serif, "New York", Georgia, serif; }
  .status { padding: 30vh 24px; text-align: center; color: var(--soft); }
</style>
</head>
<body>
<div class="wash"></div>
<div id="app"><p class="status">Opening the list…</p></div>

<script>
// Gifted wishlist card. Two kinds of link:
//   #c=<id>   the card lives in Gifted's public iCloud database (with photos),
//             and updates when it's edited in the app. Read-only key below.
//   #<data>   older links: the whole card is in the link (compressed), no photos.
// Prices are left out on purpose: tap through to the shop to see them.
const CONTAINER = "iCloud.com.shaiejenny.gifted";
// Read-only keys for the public database, one per iCloud environment.
// TestFlight and App Store builds use production; test builds use development.
const API_TOKENS = {
  production: "e961b75c13a56f667de67ead1b1c28bdd7db038bf621d8b6be4f076196de1f09",
  development: "0284c98ecf68bdc4111b4db92b222211d8e8d73f0100702fa667e84933f7b0fb"
};
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeURL = u => /^https:\/\//i.test(u || "") ? u : null;
const ACCENTS = { Christmas: "#C4453C", Birthday: "#EE7B6A", Anytime: "#A284D0" };

function showStatus(text) { app.innerHTML = `<p class="status">${esc(text)}</p>`; }

async function decode(fragment) {
  const b64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

async function lookup(id) {
  for (const [env, token] of Object.entries(API_TOKENS)) {
    if (!/^[0-9a-f]{64}$/.test(token)) continue;
    try {
      const res = await fetch(`https://api.apple-cloudkit.com/database/1/${CONTAINER}/${env}/public/records/lookup?ckAPIToken=${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ records: [{ recordName: "card-" + id }] })
      });
      if (!res.ok) continue;
      const record = (await res.json()).records?.[0];
      if (record && record.fields?.payload) return record;
    } catch (e) { /* try the next environment */ }
  }
  return null;
}

function render(p, photos = []) {
  const who = p.n ? `${p.n.split(" ")[0]}'s wishlist` : "My wishlist";
  document.title = who;
  document.documentElement.style.setProperty("--accent", ACCENTS[p.o] || "#EE7B6A");
  const forName = (p.f || "").split(" ")[0];
  const when = p.o === "Anytime" ? "" : `${esc(p.o)} ${esc(p.y)}`;

  const items = (p.i || []).map((it, n) => {
    const url = safeURL(it.u);
    const photo = Number.isInteger(it.p) ? safeURL(photos[it.p]) : null;
    const inner = `
      ${photo ? `<img class="thumb" src="${esc(photo)}" alt="" loading="lazy">` : `<div class="num">${n + 1}</div>`}
      <div class="text"><div class="name">${esc(it.t)}</div>${it.s ? `<div class="shop">${esc(it.s)}</div>` : ""}</div>
      ${url ? `<span class="open">Open</span>` : ""}`;
    return url ? `<a class="item" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
               : `<div class="item">${inner}</div>`;
  }).join("");

  app.innerHTML = `
    <main>
      ${when ? `<div class="kicker">${when}</div>` : ""}
      <h1>${esc(who)}</h1>
      <div class="sub">${forName ? `Ideas for ${esc(forName)}` : "Some ideas"}</div>
      <div class="list">${items}</div>
      ${p.d ? `<div class="note"><div class="label">If in doubt</div><div class="body">${esc(p.d)}</div></div>` : ""}
      <p class="hint">Tap one to see where to get it.</p>
      <footer>Made with <b>Gifted</b></footer>
    </main>`;
}

(async () => {
  const fragment = location.hash.slice(1);
  if (!fragment) { showStatus("This link isn't complete. Ask whoever sent it for the full link."); return; }
  if (fragment.startsWith("c=")) {
    const id = fragment.slice(2).toLowerCase();
    if (!/^[0-9a-f-]{36}$/.test(id)) { showStatus("This link isn't complete. Ask whoever sent it for the full link."); return; }
    const record = await lookup(id);
    if (!record) { showStatus("This list isn't available any more."); return; }
    let payload;
    try { payload = JSON.parse(record.fields.payload.value); } catch { showStatus("This list couldn't be read."); return; }
    const photos = (record.fields.thumbs?.value || []).map(a => a?.downloadURL ? a.downloadURL.replace("${f}", "photo.jpg") : null);
    render(payload, photos);
    return;
  }
  try { render(await decode(fragment)); }
  catch (e) { showStatus("This list couldn't be opened. Try opening the link in Safari or Chrome."); }
})();
</script>
</body>
</html>
